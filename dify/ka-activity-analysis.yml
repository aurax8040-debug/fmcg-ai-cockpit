app:
  description: 基于受控活动证据生成可引用、待验证的经营研判
  icon: 🥝
  icon_background: '#E4F4D4'
  icon_type: emoji
  mode: workflow
  name: 快消智析·KA活动研判
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - { id: start-source-normalize-target, source: start, sourceHandle: source, target: normalize, targetHandle: target, type: custom, data: { sourceType: start, targetType: code, isInIteration: false, isInLoop: false } }
      - { id: normalize-source-llm-target, source: normalize, sourceHandle: source, target: llm, targetHandle: target, type: custom, data: { sourceType: code, targetType: llm, isInIteration: false, isInLoop: false } }
      - { id: llm-source-validate-target, source: llm, sourceHandle: source, target: validate, targetHandle: target, type: custom, data: { sourceType: llm, targetType: code, isInIteration: false, isInLoop: false } }
      - { id: validate-source-end-target, source: validate, sourceHandle: source, target: end, targetHandle: target, type: custom, data: { sourceType: code, targetType: end, isInIteration: false, isInLoop: false } }
    nodes:
      - id: start
        type: custom
        position: { x: 40, y: 240 }
        positionAbsolute: { x: 40, y: 240 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 246
        data:
          title: 输入受控证据
          type: start
          variables:
            - { variable: activity_id, label: activity_id, type: text-input, required: true, max_length: 80, options: [] }
            - { variable: question, label: question, type: paragraph, required: true, max_length: 1000, options: [] }
            - { variable: role, label: role, type: text-input, required: true, max_length: 80, options: [] }
            - { variable: evidence_json, label: evidence_json, type: paragraph, required: true, max_length: 200000, options: [] }
            - { variable: data_version, label: data_version, type: text-input, required: true, max_length: 40, options: [] }
      - id: normalize
        type: custom
        position: { x: 344, y: 240 }
        positionAbsolute: { x: 344, y: 240 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: 证据门槛与规范化
          type: code
          code_language: python3
          variables:
            - { variable: evidence_json, value_selector: [start, evidence_json], value_type: string }
            - { variable: data_version, value_selector: [start, data_version], value_type: string }
          outputs:
            normalized: { type: string, children: null }
          code: |-
            import json
            def main(evidence_json: str, data_version: str) -> dict:
                data = json.loads(evidence_json)
                if str(data.get("data_version")) != str(data_version):
                    raise ValueError("evidence data_version mismatch")
                if not isinstance(data.get("trace_ids"), list) or not data["trace_ids"]:
                    raise ValueError("trace_ids required")
                return {"normalized": json.dumps(data, ensure_ascii=False)}
      - id: llm
        type: custom
        position: { x: 648, y: 240 }
        positionAbsolute: { x: 648, y: 240 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
        data:
          title: DeepSeek受控研判
          type: llm
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-chat
            mode: chat
            completion_params: { temperature: 0.1 }
          context: { enabled: false, variable_selector: [] }
          vision: { enabled: false }
          prompt_template:
            - role: system
              text: |-
                你是KA活动经营研判助手。只能使用用户提供的evidence_json。
                经营数字不得自行重算。每条事实、缺口、假设、建议都要引用输入trace_ids中的值。
                假设必须标记待验证。没有库存证据不得判断缺货；没有有效对照不得声称因果增量；不得自动审批费用或资源。
                只输出合法JSON，不要Markdown。字段必须为facts、data_gaps、hypotheses、recommended_checks、boundaries、management_summary、citations。
                facts、data_gaps、hypotheses、recommended_checks四项为[{"text":"...","citations":["..."]}]；boundaries必须是纯字符串数组（每项是字符串，不要用对象或引用）；management_summary含title和conclusion；citations为本次使用的全部引用去重集合。
                严格数量约束：facts、data_gaps、hypotheses、recommended_checks、boundaries 每项最多6条，超出只保留最关键的6条。
                引用约束：facts 每条必须至少引用一个业务证据trace_id（TPM/POS/SFA开头），不得只用知识库（KB开头）条款作为本店经营事实证据；知识条款只能用于hypotheses或recommended_checks作为核查依据。
            - role: user
              text: |-
                活动：{{#start.activity_id#}}
                角色：{{#start.role#}}
                问题：{{#start.question#}}
                数据版本：{{#start.data_version#}}
                evidence_json：{{#normalize.normalized#}}
      - id: validate
        type: custom
        position: { x: 952, y: 240 }
        positionAbsolute: { x: 952, y: 240 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: JSON与引用校验
          type: code
          code_language: python3
          variables:
            - { variable: model_text, value_selector: [llm, text], value_type: string }
            - { variable: evidence_json, value_selector: [normalize, normalized], value_type: string }
          outputs:
            analysis: { type: object, children: null }
          code: |-
            import json
            def main(model_text: str, evidence_json: str) -> dict:
                result = json.loads(model_text.strip().removeprefix("```json").removesuffix("```").strip())
                required = ["facts", "data_gaps", "hypotheses", "recommended_checks", "boundaries", "management_summary", "citations"]
                if any(key not in result for key in required):
                    raise ValueError("missing required output field")
                allowed = set(json.loads(evidence_json)["trace_ids"])
                if any(citation not in allowed for citation in result["citations"]):
                    raise ValueError("unknown citation")
                return {"analysis": result}
      - id: end
        type: custom
        position: { x: 1256, y: 240 }
        positionAbsolute: { x: 1256, y: 240 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: 返回受控研判
          type: end
          outputs:
            - variable: analysis
              value_type: object
              value_selector: [validate, analysis]
    viewport: { x: 0, y: 0, zoom: 0.7 }
  rag_pipeline_variables: []
